name: Screenshots

# Renders every screen with Robolectric's native canvas and publishes the PNGs to the
# ci-screenshots branch (and as a workflow artifact) for quick visual review.
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screens
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*ScreenshotTest*'

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/*.png

      - name: Publish to ci-screenshots branch
        run: |
          cd app/build/screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
